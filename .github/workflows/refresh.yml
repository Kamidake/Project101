name: Refresh live playlist
on:
  schedule:
    - cron: '1,16,31,46 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scraper.py', 'metadata.py', 'tests/**', 'assets/**', '.github/workflows/refresh.yml']
permissions:
  contents: write
concurrency:
  group: playlist-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test parser
        run: python -m unittest discover -s tests -v
      - name: Generate playlist
        run: python scraper.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playlist-diagnostics
          path: |
            status.json
            epg.xml
          retention-days: 7
      - name: Commit files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          
          # Add all files to staging FIRST
          git add playlist.m3u epg.xml status.json
          
          # Check if there are any staged changes
          if git diff --cached --quiet; then
            echo 'No changes to commit; skipping repository update.'
            exit 0
          fi
          
          # Commit and push if changes exist
          git commit -m 'Refresh live playlist and EPG'
          git push
