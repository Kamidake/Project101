name: Refresh PPV playlist
on:
  schedule:
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ppv_scraper.py', 'ppv_tests/**', '.github/workflows/ppv.yml']
permissions:
  contents: write
# Serialize publication with Roxie so two jobs cannot race to push main.
concurrency:
  group: playlist-refresh
  cancel-in-progress: false
jobs:
  ppv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test PPV exporter
        run: python -m unittest discover -s ppv_tests -v
      - name: Generate PPV playlist
        run: python ppv_scraper.py
      - name: Upload PPV diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppv-diagnostics
          path: ppv-status.json
          retention-days: 7
      - name: Publish PPV changes
        run: |
          if git diff --quiet -- ppv.m3u; then
            echo 'PPV playlist unchanged; skipping publication.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ppv.m3u ppv-status.json
          git commit -m 'Refresh separate PPV playlist'
          git pull --rebase origin main
          git push
